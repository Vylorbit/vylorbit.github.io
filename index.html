<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vylorbit - Central de Downloads</title>

    <style>
        /* Estilo Geral da Página (Fundo Escuro) */
        body {
            background-color: #121214;
            color: #e1e1e6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        /* Caixa Central do Conteúdo */
        .container {
            background-color: #1d1d22;
            padding: 30px;
            border-radius: 12px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            border: 1px solid #29292e;
        }

        /* Títulos e Textos */
        h1 {
            color: #00ff88; /* Verde Tecnológico */
            font-size: 28px;
            margin-bottom: 10px;
        }

        p {
            color: #a8a8b3;
            font-size: 16px;
            line-height: 1.6;
        }

        /* O Botão de Download */
        .btn-download {
            display: inline-block;
            background-color: #00ff88;
            color: #121214;
            font-weight: bold;
            font-size: 18px;
            text-decoration: none;
            padding: 15px 40px;
            border-radius: 8px;
            margin-top: 25px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 255, 136, 0.3);
        }

        /* Efeito ao passar o mouse no botão */
        .btn-download:hover {
            background-color: #00cc6a;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 255, 136, 0.5);
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Vylorbit</h1>
        <p>Clique no botão abaixo para iniciar o seu download seguro. Você passará por uma página rápida de verificação de anúncios para liberar o arquivo.</p>
        
        <!-- APAGUE O '#' ABAIXO E COLE SEU LINK DO CUTY.IO ENTRE AS ASPAS -->
        <a href="#" target="_blank" class="btn-download">BAIXAR ARQUIVO</a>
    </div>

</body>
  
</html>
